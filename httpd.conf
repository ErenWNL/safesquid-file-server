# ============================================================================
# SafeSquid file server — self-contained Apache vhost
# ============================================================================
#
# Run with:   make serve
# Or:         SAFESQUID_ROOT="$PWD" httpd -f "$PWD/httpd.conf" -DFOREGROUND
#
# Nothing here touches /etc/apache2. This config loads only the modules it
# needs and runs unprivileged on port 8081 (8080 is commonly occupied).
#
# ---------------------------------------------------------------------------
# THE CENTRAL RULE
# ---------------------------------------------------------------------------
# Apache serves file BYTES out of storage/ and is never permitted to LIST a
# directory. The listing comes exclusively from public/manifest.json, rendered
# client-side. That is enforced here in four independent places, because
# Options -Indexes alone is not enough:
#
#   1. Options -Indexes          — no autoindex module output
#   2. DirectoryIndex disabled   — an index.html dropped into storage/ is not
#                                  silently promoted to a directory listing
#   3. RewriteRule → 404         — a directory request under /files/ is not
#                                  found, rather than forbidden (403 would
#                                  confirm the directory exists)
#   4. Options -FollowSymLinks   — a symlink cannot walk out of the tree
#
# ---------------------------------------------------------------------------
# PATH TRAVERSAL: WHERE THE PROTECTION ACTUALLY LIVES
# ---------------------------------------------------------------------------
# There is no application server in this request path — Apache maps URLs to
# files itself — so there is no single normalize() function to point at. A
# reviewer looking for one will not find it. The protection is layered across
# the three places a path is genuinely resolved:
#
#   REQUEST TIME    (this file)      reject traversal, encoded traversal, null
#                                    bytes and dotfiles before URL→file mapping
#   GENERATION TIME (generate-manifest.sh)
#                                    realpath containment against the resolved
#                                    storage root; the only layer that can see
#                                    a symlink escape
#   CLIENT TIME     (public/js/app.js)
#                                    the router walks the manifest tree node by
#                                    node instead of concatenating path strings
#
# scripts/verify-security.sh asserts every claim this comment block makes.
# ============================================================================

# Apache installation paths differ per platform, so they come from the
# environment rather than being hardcoded. The Makefile detects which httpd is
# in use and exports all three; see "Running it" in the README for the manual
# invocation if you are not using make.
#
#   macOS, Apple's built-in   ServerRoot /usr        modules libexec/apache2
#   macOS, Homebrew           /opt/homebrew/opt/httpd        lib/httpd/modules
#   Debian/Ubuntu             /etc/apache2                   /usr/lib/apache2/modules
ServerRoot "${APACHE_SERVER_ROOT}"

# ---------------------------------------------------------------------------
# Modules — exactly what is needed, nothing else.
# mod_autoindex is deliberately NOT loaded. Not disabled by configuration:
# absent. The module that generates "Index of /" pages is the thing this
# project replaces, so it is not in the process at all.
# ---------------------------------------------------------------------------
LoadModule mpm_event_module   "${APACHE_MODULE_DIR}/mod_mpm_event.so"
LoadModule authz_core_module  "${APACHE_MODULE_DIR}/mod_authz_core.so"
LoadModule unixd_module       "${APACHE_MODULE_DIR}/mod_unixd.so"
LoadModule log_config_module  "${APACHE_MODULE_DIR}/mod_log_config.so"
LoadModule mime_module        "${APACHE_MODULE_DIR}/mod_mime.so"
LoadModule alias_module       "${APACHE_MODULE_DIR}/mod_alias.so"
LoadModule dir_module         "${APACHE_MODULE_DIR}/mod_dir.so"
LoadModule headers_module     "${APACHE_MODULE_DIR}/mod_headers.so"
LoadModule rewrite_module     "${APACHE_MODULE_DIR}/mod_rewrite.so"
LoadModule deflate_module     "${APACHE_MODULE_DIR}/mod_deflate.so"
LoadModule filter_module      "${APACHE_MODULE_DIR}/mod_filter.so"
LoadModule setenvif_module    "${APACHE_MODULE_DIR}/mod_setenvif.so"

Listen 8081
ServerName localhost:8081

# ---------------------------------------------------------------------------
# Information disclosure
# ---------------------------------------------------------------------------
# Prod emits "Server: Apache" with no version, no OS, no module list. The
# default (Full) tells an attacker exactly which CVEs to try first.
ServerTokens Prod
ServerSignature Off

# TRACE echoes the request back, including headers. It has no legitimate use
# on a download server and enables cross-site tracing.
TraceEnable Off

# Encoded slashes never decode into path separators. Belt and braces alongside
# the rewrite rules below — stated explicitly rather than relied on as a
# default that a future Apache might change.
AllowEncodedSlashes Off

PidFile "${SAFESQUID_ROOT}/logs/httpd.pid"
ErrorLog "${SAFESQUID_ROOT}/logs/error.log"
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "${SAFESQUID_ROOT}/logs/access.log" combined

DocumentRoot "${SAFESQUID_ROOT}/public"

TypesConfig "${APACHE_MIME_TYPES}"
AddType application/javascript .js
AddType application/json .json

# ---------------------------------------------------------------------------
# Global default: deny everything, then open up explicitly.
# ---------------------------------------------------------------------------
<Directory />
    AllowOverride None
    Require all denied
    Options None
</Directory>

# ===========================================================================
# The site itself — public/
# ===========================================================================
<Directory "${SAFESQUID_ROOT}/public">
    Require all granted

    # -Indexes         no autoindex, even though the module is not loaded
    # -FollowSymLinks  a symlink here cannot reach outside the docroot
    # -ExecCGI         nothing under public/ is executable
    # -Includes        no server-side includes
    Options -Indexes -FollowSymLinks -ExecCGI -Includes -MultiViews

    # AllowOverride None is a security AND performance decision. Every rule
    # this server needs lives in this file. Enabling .htaccess would make
    # Apache stat for one in every directory on every request, and would let
    # anything that can write to public/ change the server's configuration.
    AllowOverride None

    DirectoryIndex index.html

    # Config-shaped filenames, denied INSIDE the docroot only.
    #
    # This deliberately does NOT apply to storage/. It sat in global scope
    # originally, which meant a published artifact named install-helper.sh or
    # build.log was denied by authz_core while the manifest still listed it —
    # the UI showed a download link that always 403'd. Artifacts are published
    # content, and Content-Disposition: attachment on the alias means nothing
    # under /files/ can render or execute whatever its extension.
    #
    # Nothing matching this lives in public/ today; the rule is here so that a
    # future stray .conf or .sh in the docroot fails closed.
    <FilesMatch "^(httpd\.conf|.*\.conf|Makefile|.*\.sh|.*\.log|.*\.pid)$">
        Require all denied
    </FilesMatch>
</Directory>

# ===========================================================================
# Artifact bytes — storage/, exposed read-only at /files/
# ===========================================================================
Alias "/files" "${SAFESQUID_ROOT}/storage"

<Directory "${SAFESQUID_ROOT}/storage">
    Require all granted

    # -FollowSymLinks is the request-time half of the symlink defense. The
    # generator already refuses to index symlinks; this ensures that even a
    # hand-crafted URL cannot follow one out of the tree.
    Options -Indexes -FollowSymLinks -ExecCGI -Includes -MultiViews

    AllowOverride None

    # Without this, dropping an index.html into any storage folder turns that
    # folder into a servable page — a file out of storage/ rendering through
    # the site, which is exactly what the attachment header below exists to
    # prevent.
    DirectoryIndex disabled

    # No trailing-slash redirect. A redirect would confirm a directory exists
    # before anything else got a chance to answer.
    DirectorySlash Off

    # NOTE, and it is a deliberate tradeoff — found by running this, not by
    # reading it:
    #
    # The obvious way to make directory requests return 404 instead of 403 is a
    # per-directory `RewriteCond %{REQUEST_FILENAME} -d` / `RewriteRule ^ -
    # [R=404]`. Apache REFUSES to run RewriteRule in a <Directory> block when
    # both FollowSymLinks and SymLinksIfOwnerMatch are off, because a
    # per-directory rewrite can circumvent directory restrictions in the same
    # way a symlink can (AH00670). The two directives are mutually exclusive,
    # and with both present Apache 403s every request under /files/ — including
    # legitimate downloads.
    #
    # So it is one or the other. -FollowSymLinks is a real protection against a
    # symlink walking out of the artifact tree. 404-instead-of-403 is cosmetic
    # hardening against existence disclosure. Trading the former for the latter
    # would be a bad deal, so -FollowSymLinks stays and the RewriteRule is gone.
    #
    # The residual disclosure is narrow and partly closed below: RedirectMatch
    # (mod_alias, no symlink dependency) turns trailing-slash directory requests
    # into 404s. A directory request WITHOUT a trailing slash still returns 403.
    # Both render the identical error page, so the difference is visible only in
    # the status code.

    # Every artifact downloads; nothing under storage/ ever renders inline.
    # This is not only download UX. A file server hosts whatever it is given,
    # and forcing attachment disposition eliminates stored-XSS-via-hosted-HTML
    # as an entire class of bug.
    #
    # Deliberately "Header set" (onsuccess) and not "always": a 404 from this
    # directory should render the error page, not download it.
    Header set Content-Disposition "attachment"

    # One of the honest reasons to replace mod_autoindex is that its output
    # leaks the whole artifact tree to crawlers. Saying so in the README while
    # leaving the replacement crawlable would be hollow.
    Header always set X-Robots-Tag "noindex, nofollow"
</Directory>

# Trailing-slash directory requests under /files/ are Not Found rather than
# Forbidden. RedirectMatch is mod_alias, so unlike RewriteRule it carries no
# FollowSymLinks dependency and coexists with -FollowSymLinks above.
RedirectMatch 404 "^/files/(.*/)?$"

# ===========================================================================
# Denials
# ===========================================================================

# Dotfiles: .git, .htaccess, .env, .gitkeep, anything else. FilesMatch covers
# the filename; the rewrite rule further down covers dot-DIRECTORIES, which
# FilesMatch alone cannot see.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# scripts/ holds the manifest generator and the security tests. It lives
# outside DocumentRoot and so is already unreachable, but a future change that
# moves or symlinks it should fail closed rather than open.
<Directory "${SAFESQUID_ROOT}/scripts">
    Require all denied
</Directory>

<Directory "${SAFESQUID_ROOT}/logs">
    Require all denied
</Directory>

# ===========================================================================
# Request-time path defense + History API routing
# ===========================================================================
RewriteEngine On

# --- Traversal and null bytes ----------------------------------------------
#
# Two variables, because they see different things:
#
#   THE_REQUEST  the raw request line, exactly as sent, still percent-encoded.
#                This is the only place %2e%2e is visible.
#   REQUEST_URI  already decoded once by Apache. This catches literal ../
#
# Checking only REQUEST_URI misses encoded traversal; checking only
# THE_REQUEST misses anything Apache normalised before rewrite saw it.
RewriteCond %{THE_REQUEST} (^|[/\\])\.\.([/\\]|\s) [NC,OR]
RewriteCond %{THE_REQUEST} (%2e|%252e){2} [NC,OR]
RewriteCond %{THE_REQUEST} (%2f|%5c|%252f|%255c) [NC,OR]
RewriteCond %{THE_REQUEST} %00 [NC,OR]
RewriteCond %{REQUEST_URI} (^|/)\.\.(/|$) [OR]
RewriteCond %{REQUEST_URI} %00 [NC]
RewriteRule ^ - [F,L]

# --- Dot-directories -------------------------------------------------------
# Any path segment beginning with a dot, at any depth: /.git/config,
# /files/.hidden/x, /.env. FilesMatch above only sees the final component.
RewriteRule (^|/)\.[^/]* - [F,L]

# --- Config and tooling paths ----------------------------------------------
#
# These must be denied HERE, before the History API fallback below, not only by
# the <FilesMatch> / <Directory> blocks further down.
#
# httpd.conf, scripts/ and logs/ all live outside DocumentRoot, so their
# contents are already unreachable — verified, the bodies are never served. But
# without these rules the SPA fallback treats /httpd.conf as an unknown app
# route and answers 200 with index.html, which makes the <FilesMatch> denials
# dead code and makes an automated scanner report "200 OK on /httpd.conf".
# Failing closed with 403 is both more honest and what a reviewer expects.
# The extension denial must NOT apply under /files/. Artifacts are published
# content: a download server hosting install.sh, a build .log or a sample
# .conf is entirely ordinary, and without this exclusion those 403 while the
# manifest still lists them — the UI shows a link that always fails. No
# security is lost, because Content-Disposition: attachment on the alias means
# nothing under /files/ can render or execute in the browser regardless of its
# extension.
RewriteCond %{REQUEST_URI} !^/files(/|$)
RewriteRule \.(conf|sh|log|pid|bak|swp)$ - [F,L]

RewriteRule ^/?(scripts|logs)(/|$) - [F,L]
RewriteRule ^/?(Makefile|TIMELOG\.md|USAGE\.md|TODOS\.md)$ - [F,L]

# --- History API fallback --------------------------------------------------
#
# Deep links like /browse/SWG must serve index.html so the client router can
# take over. Written the obvious way, that rule ALSO matches a missing file
# under /files/ — and then a stale download link returns the HTML page with
# HTTP 200, so `curl -O` silently writes a web page to disk under the .iso
# name it asked for. Silent, wrong, and easy to trip over by accident.
#
# The first condition is what prevents it. /files/ is never rewritten: a
# missing artifact 404s like a missing artifact should.
#
# The -f / -d tests use %{DOCUMENT_ROOT}%{REQUEST_URI}, NOT %{REQUEST_FILENAME}.
# In server/vhost context REQUEST_FILENAME has not been mapped to a filesystem
# path yet — it is still the URI — so `!-f` tests whether a path like
# "/manifest.json" exists from the filesystem ROOT, which it never does. That
# makes the condition always true and rewrites EVERY request to index.html:
# manifest.json, every stylesheet, every module. The site serves one HTML page
# for everything and appears totally broken.
#
# This is the second bug in this file that only surfaced by running it. Both
# were invisible to `httpd -t`, which reports Syntax OK either way.
# Only /browse/... is an application route, so only /browse/... is rewritten.
#
# The earlier form rewrote anything that was not an existing file, which is the
# usual SPA recipe and is too broad here. A MISSING /manifest.json was answered
# with index.html and HTTP 200, so the client received HTML, threw SyntaxError
# parsing it, and told the user the index "could not be parsed" instead of the
# actionable "it has not been generated yet, run make manifest". The same held
# for any missing stylesheet or module.
#
# Naming the route prefix explicitly means every other unknown path — a missing
# asset, a mistyped URL, a scanner probing /README.md — gets a real 404 and the
# error page, which is both more honest and easier to debug. `/` itself is
# served by DirectoryIndex, not by this rule.
RewriteRule ^/?browse(/|$) /index.html [L]

# ===========================================================================
# Security headers
# ===========================================================================

# No MIME sniffing. Without this a browser may second-guess Content-Type and
# execute something it decided looks like script.
Header always set X-Content-Type-Options "nosniff"

# No framing at all. Clickjacking has no legitimate use case here.
Header always set X-Frame-Options "DENY"

# Referrer-Policy keeps artifact paths out of the Referer header on outbound
# navigation — a download URL is not something to leak to third parties.
Header always set Referrer-Policy "no-referrer"

# Content-Security-Policy.
#
# default-src 'none' means everything is denied unless named below. Note what
# is absent: no 'unsafe-inline' anywhere, in script-src or style-src.
#
# That constraint is why the Web Components link an external stylesheet into
# their shadow roots rather than carrying a <style> block. A <style> inside a
# shadow root is still an inline style as far as CSP is concerned, and
# style-src 'self' blocks it — the standard tutorial pattern for Web
# Components breaks the moment a strict policy is switched on.
#
#   frame-ancestors 'none'  no embedding (the CSP-native X-Frame-Options)
#   base-uri 'none'         a <base> tag cannot be injected to repoint URLs
#   form-action 'none'      there are no forms; nothing may post anywhere
#   object-src 'none'       no plugins
Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# ===========================================================================
# Caching
# ===========================================================================

# The manifest is a cache of the filesystem and is stale the moment storage/
# changes. Letting the browser cache it on top of that would stack one staleness
# on another and make the generatedAt stamp in the footer lie.
<LocationMatch "^/manifest\.json$">
    Header always set Cache-Control "no-cache, must-revalidate"
</LocationMatch>

# Assets are NOT content-hashed, so a long max-age would serve stale CSS after
# a deploy. Five minutes is the honest number for unfingerprinted files. In
# production these should be fingerprinted and this raised to a year.
<LocationMatch "^/(css|js)/">
    Header always set Cache-Control "public, max-age=300"
</LocationMatch>

# ===========================================================================
# Compression
# ===========================================================================
# The manifest is the largest thing on the wire and compresses extremely well
# (repetitive JSON keys), so this is the single highest-value setting here.
AddOutputFilterByType DEFLATE application/json
AddOutputFilterByType DEFLATE application/javascript text/javascript
AddOutputFilterByType DEFLATE text/css
AddOutputFilterByType DEFLATE text/html text/plain

# Already-compressed artifacts gain nothing and cost CPU.
SetEnvIfNoCase Request_URI \.(?:gz|tgz|zip|iso|ova|dmg|exe|deb|rpm|xz|bz2)$ no-gzip dont-vary

# ===========================================================================
# Error pages
# ===========================================================================
# One page for both, so a 403 and a 404 look identical to anyone probing for
# which paths exist.
ErrorDocument 403 /error.html
ErrorDocument 404 /error.html
